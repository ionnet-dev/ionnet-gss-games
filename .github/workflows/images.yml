# Builds and publishes the game images: every <game>/image/image.yml names an image and its variants, built from the
# Dockerfile beside it and pushed as ghcr.io/ionnet-dev/<name>:<tag> (linux/amd64).
# A variant is only rebuilt when its inputs changed (.github/scripts/image-inputs.sh): the files in image/, its build
# args, or the exact image behind one of its FROM lines (a new ionnet-gss-base, a republished JRE). Each image carries
# its inputs as labels, and the plan compares against the published image's labels. A rebuild nobody needs would make
# every host download the image again and recreate the server's container at its next install.
# Storage is kept small on purpose: no workflow artifacts, no build cache, no provenance/SBOM attestations, and
# every package's untagged versions (the images a tag pointed at before) are deleted after each run that built.
name: Images

on:
  push:
    branches: [main]
    paths:
      - "*/image/**"
      - ".github/scripts/**"
      - ".github/workflows/images.yml"
  schedule:
    - cron: "17 4 * * *" # Daily, after the base image's check: picks up a new ionnet-gss-base or JRE. Seconds when nothing changed.
  workflow_dispatch:
    inputs:
      game:
        description: Game folder to check (empty = every game with an image)
        required: false
        default: ""
      force:
        description: Build even when the inputs are unchanged
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false # Never stop halfway through publishing.

env:
  REGISTRY: ghcr.io/ionnet-dev

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      names: ${{ steps.plan.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        name: Check which images have new inputs
        env:
          GAME: ${{ github.event.inputs.game }}
          FORCE: ${{ github.event.inputs.force }}
        run: .github/scripts/plan-images.sh

  build:
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    name: ${{ matrix.name }}:${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}/image
          platforms: linux/amd64
          build-args: ${{ matrix.args }}
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            ${{ matrix.labels }}
          pull: true # Build on the base and JRE images the plan just checked.
          push: true
          provenance: false
          sbom: false

  cleanup:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.names != '[]' }} # Only images this run built.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.plan.outputs.names) }}
    steps:
      - name: Delete untagged versions of ${{ matrix.name }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.name }}
          package-type: container
          delete-only-untagged-versions: "true"
          min-versions-to-keep: 0
